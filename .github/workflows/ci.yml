name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Runner local : on n'exécute pas le code de pull requests venant de forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests (net48 et net10.0)
        run: dotnet test JBOpale.Extensions.sln --configuration Release
