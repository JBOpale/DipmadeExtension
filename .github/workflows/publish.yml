name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore JBOpale.Extensions.sln

      - name: Build
        run: dotnet build JBOpale.Extensions.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test UnitTest_Extensions/UnitTest_Extensions.csproj --configuration Release --no-build

      - name: Pack NuGet
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet pack JBOpale.Extensions/JBOpale.Extensions.csproj --configuration Release --no-build -p:Version=$version --output nupkg

      - name: Push to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $pkg = Get-ChildItem -Path nupkg -Filter *.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
