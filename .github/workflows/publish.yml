name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire la version depuis le tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore JBOpale.Extensions/JBOpale.Extensions.csproj

      - name: Build
        run: dotnet build JBOpale.Extensions/JBOpale.Extensions.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test JBOpale.Extensions/JBOpale.Extensions.csproj --configuration Release --no-restore
            
      - name: Pack NuGet
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path nupkg | Out-Null
          nuget pack JBOpale.Extensions.nuspec -Version $version -OutputDirectory nupkg

      - name: Push to NuGet
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path nupkg -Filter *.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate